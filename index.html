<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8fc">
<meta name="google" content="notranslate">
<title>Habit Tracker</title>
<style>
:root{--ink:#101114;--muted:#55535e;--green:#20b52b;--track:#e8deec;--page:#fff8fc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{background-color:var(--page);background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,245,252,.18));}
.page{width:100%;max-width:880px;min-height:100vh;margin:0 auto;padding:70px 17px 100px;position:relative;overflow:hidden;isolation:isolate}
.guides{position:absolute;z-index:2;top:0;bottom:0;left:46px;right:46px;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:9px;pointer-events:none}
.guides span{position:relative}
.guides span:before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed rgba(185,165,194,.23)}
.month-head{height:65px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 36px}
.month-title{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:42px;line-height:1;letter-spacing:-1.6px;text-align:center;margin:0}
.month-nav{width:62px;height:62px;border:0;border-radius:28px;background:#e9eee8;color:#092b17;display:grid;place-items:center;cursor:pointer;padding:0}
.month-nav:last-child{justify-self:end}
.month-nav svg{width:34px;height:34px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.month-nav:focus-visible,.day:focus-visible,.segment:focus-visible{outline:3px solid #668b69;outline-offset:3px}
.days{position:relative;z-index:3;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:9px;padding:0 29px;margin-top:25px;height:94px;align-items:start}
.day{border:0;background:transparent;color:#55535e;border-radius:30px;height:93px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:11px 0 0;cursor:pointer;font:600 20px/1.15 Arial,Helvetica,sans-serif;min-width:0}
.day .num{font-size:33px;font-weight:500;margin-top:8px;line-height:1}
.day.selected{background:#8cae8a;color:white;padding-top:11px}
.habits{margin-top:95px;display:flex;flex-direction:column;gap:31px}
.habit{height:181px;border-radius:40px;border:1.5px solid var(--edge);background:var(--surface);box-shadow:0 8px 18px rgba(85,55,94,.075);padding:23px 29px 28px;position:relative;z-index:1;touch-action:pan-y;transition:transform .18s ease,box-shadow .18s ease}
.habit{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease,border-color .28s ease}
.habit.dragging{transition:none;box-shadow:0 14px 30px rgba(70,90,70,.18);cursor:grabbing}
.habit.swiped-right{transform:translateX(18px);border-color:#a8d6a5;box-shadow:0 12px 28px rgba(65,150,75,.24)}
.habit.swiped-left{transform:translateX(-18px);border-color:#d8cbdc;box-shadow:0 12px 28px rgba(85,55,94,.20)}
.habit::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;z-index:2}
.habit::after{position:absolute;right:22px;top:15px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 21px/1 Arial,sans-serif;opacity:0;transform:scale(.4);pointer-events:none;z-index:4}
.habit.done-animation::before{background:rgba(50,190,75,.17);animation:complete-wash .72s ease-out}
.habit.done-animation::after{content:"✓";color:#fff;background:#20b52b;animation:status-pop .65s cubic-bezier(.2,.9,.25,1.35) both}
.habit.undo-animation::before{background:rgba(145,117,157,.16);animation:undo-wash .72s ease-out}
.habit.undo-animation::after{content:"↶";color:#fff;background:#887294;animation:status-pop .65s cubic-bezier(.2,.9,.25,1.35) both}
.habit.done-animation .segment.done{animation:segment-confirm .48s ease-out both}
.habit.undo-animation .segment{animation:segment-undo .42s ease-out both}
.habit.done-animation .segment:nth-child(2),.habit.undo-animation .segment:nth-child(2){animation-delay:.035s}
.habit.done-animation .segment:nth-child(3),.habit.undo-animation .segment:nth-child(3){animation-delay:.07s}
.habit.done-animation .segment:nth-child(4),.habit.undo-animation .segment:nth-child(4){animation-delay:.105s}
.habit.done-animation .segment:nth-child(5),.habit.undo-animation .segment:nth-child(5){animation-delay:.14s}
.habit.done-animation .segment:nth-child(6),.habit.undo-animation .segment:nth-child(6){animation-delay:.175s}
.habit.done-animation .segment:nth-child(7),.habit.undo-animation .segment:nth-child(7){animation-delay:.21s}
.habit.done-animation .segment:nth-child(8),.habit.undo-animation .segment:nth-child(8){animation-delay:.245s}
.habit.done-animation .segment:nth-child(9),.habit.undo-animation .segment:nth-child(9){animation-delay:.28s}
.habit.done-animation .segment:nth-child(10),.habit.undo-animation .segment:nth-child(10){animation-delay:.315s}
@keyframes complete-wash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes undo-wash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes status-pop{0%{opacity:0;transform:scale(.35) rotate(-18deg)}55%{opacity:1;transform:scale(1.18) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes segment-confirm{0%{transform:scaleY(.55);filter:brightness(1.5)}65%{transform:scaleY(1.18)}100%{transform:scaleY(1);filter:brightness(1)}}
@keyframes segment-undo{0%{transform:scaleY(1.35);filter:brightness(1.25)}100%{transform:scaleY(1);filter:brightness(1)}}
@media(prefers-reduced-motion:reduce){.habit.done-animation::before,.habit.undo-animation::before,.habit.done-animation::after,.habit.undo-animation::after,.habit.done-animation .segment,.habit.undo-animation .segment{animation:none;opacity:1;transform:none}}
@media(max-width:650px){.habit.swiped-right{transform:translateX(12px)}.habit.swiped-left{transform:translateX(-12px)}}
.habit-top,.progress{position:relative;z-index:3}
.habit-top{height:80px;display:grid;grid-template-columns:102px 1fr auto;align-items:center;column-gap:42px}
.icon-tile{width:102px;height:80px;border-radius:30px;background:var(--icon-bg);display:grid;place-items:center}
.icon-tile svg{width:62px;height:62px;stroke:var(--icon-color);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.habit-name{font-size:38px;line-height:1;font-weight:700;letter-spacing:-1.1px;white-space:nowrap}
.percent{font-size:38px;line-height:1;font-weight:500;color:#56535f;letter-spacing:-1.2px;padding-right:0}
.progress{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:9px;margin-top:15px}
.segment{height:28px;border:0;border-radius:18px;background:var(--track);padding:0;cursor:pointer;min-width:0}
.segment.done{background:var(--green);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.reading{--surface:rgba(245,231,250,.68);--edge:#f0e2f4;--icon-bg:rgba(226,208,238,.56);--icon-color:#55505d}
.meditation{--surface:rgba(255,235,240,.68);--edge:#f8e1e8;--icon-bg:rgba(255,215,224,.55);--icon-color:#8d170f}
.water{--surface:rgba(232,237,255,.69);--edge:#dfe5ff;--icon-bg:rgba(207,218,255,.58);--icon-color:#082b4c}
.pushups{--surface:rgba(244,249,242,.78);--edge:#e1eee0;--icon-bg:rgba(222,235,216,.62);--icon-color:#0c351b}
@media(max-width:650px){
 .page{padding:34px 12px 60px}
 .guides{left:27px;right:27px;gap:5px}
 .month-head{padding:0 8px;height:56px}
 .month-title{font-size:clamp(27px,6vw,38px)}
 .month-nav{width:48px;height:48px;border-radius:21px}
 .month-nav svg{width:27px;height:27px}
 .days{margin-top:20px;height:76px;gap:5px;padding:0 15px}
 .day{height:76px;padding-top:9px;font-size:clamp(10px,2.8vw,16px);border-radius:22px}
 .day .num{font-size:clamp(17px,4.3vw,25px);margin-top:7px}
 .habits{margin-top:65px;gap:18px}
 .habit{height:auto;min-height:142px;border-radius:28px;padding:16px 15px 20px}
 .habit-top{height:64px;grid-template-columns:66px 1fr auto;column-gap:14px}
 .icon-tile{width:66px;height:64px;border-radius:22px}
 .icon-tile svg{width:45px;height:45px}
 .habit-name{font-size:clamp(19px,4.5vw,30px);letter-spacing:-.6px}
 .percent{font-size:clamp(20px,4.5vw,30px)}
 .progress{gap:5px;margin-top:13px}
 .segment{height:17px}
}
@media(min-width:651px) and (max-width:780px){
 .habit-top{column-gap:25px}
 .habit-name,.percent{font-size:clamp(28px,4.3vw,36px)}
 .icon-tile{width:88px}
 .habit-top{grid-template-columns:88px 1fr auto}
}

.account-bar{position:absolute;top:18px;right:18px;z-index:20;display:flex;align-items:center;gap:9px}
.account-status{font-size:12px;color:#68636c}
.account-button{border:1px solid #ded7df;background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;color:#28242b}
.auth-backdrop{position:fixed;inset:0;z-index:100;background:rgba(25,20,28,.38);display:none;align-items:center;justify-content:center;padding:20px}
.auth-backdrop.open{display:flex}
.auth-panel{width:min(100%,390px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 70px rgba(20,10,30,.2)}
.auth-panel h2{font-size:24px;margin:0 0 8px}
.auth-panel p{font-size:14px;line-height:1.5;color:#666;margin:0 0 20px}
.auth-panel input{width:100%;height:48px;border:1px solid #ddd5df;border-radius:12px;padding:0 14px;font-size:16px;margin-bottom:12px}
.auth-panel button{width:100%;height:46px;border:0;border-radius:12px;background:#8cae8a;color:white;font-weight:700;font-size:15px}
.auth-panel button:disabled{opacity:.6}
.auth-message{font-size:13px;color:#62566a;min-height:20px;margin-top:12px}
.auth-close{margin-top:8px;background:transparent!important;color:#777!important}
@media(max-width:650px){.page{padding-top:76px}.account-bar{top:12px;right:14px}.account-status{display:none}}
</style>
</head>

<script>
(() => {
  const monthEl = document.getElementById('month');
  const daysEl = document.getElementById('days');
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const weekday = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const STORAGE_KEY = 'habit-plus-state-v1';
  let selectedDate = new Date();
  function saveState(){
    try{
      const habits={};
      habitData.forEach((map,name)=>{habits[name]=Object.fromEntries(map);});
      localStorage.setItem(STORAGE_KEY,JSON.stringify({selectedDate:key(selectedDate),habits}));
    }catch(error){console.warn('Could not save habit data',error);}
  }
  function loadState(){
    try{
      const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
      if(!saved)return null;
      if(typeof saved.selectedDate==='string' && /^\d{4}-\d{2}-\d{2}$/.test(saved.selectedDate)){
        const [y,m,d]=saved.selectedDate.split('-').map(Number);
        selectedDate=new Date(y,m-1,d);
      }
      return saved.habits && typeof saved.habits==='object' ? saved.habits : {};
    }catch(error){console.warn('Could not load saved habit data',error);return {};}
  }
  const key = d => [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const shift = (d,n) => new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
  const visibleDates = () => Array.from({length:10},(_,i)=>shift(selectedDate,i-9));
  const habitData = new Map();
  const patterns = {
    'Reading': {visible:[1,1,0,1,1,0,1,1,0,1],total:21},
    'Meditation': {visible:[1,0,1,1,1,0,0,1,0,0],total:18},
    'Water': {visible:[1,1,0,1,1,1,1,1,1,1],total:27},
    'Push-ups': {visible:[1,1,0,1,1,0,1,1,0,0],total:23}
  };
  function initializeHistory(savedHabits={}){
    document.querySelectorAll('.habit').forEach(card=>{
      const name=card.dataset.name, spec=patterns[name], map=new Map();
      const first20=spec.total-spec.visible.reduce((a,b)=>a+b,0);
      for(let i=0;i<20;i++) map.set(key(shift(selectedDate,i-29)),i<first20);
      spec.visible.forEach((v,i)=>map.set(key(shift(selectedDate,i-9)),!!v));
      const saved=savedHabits[name];
      if(saved && typeof saved==='object'){
        Object.entries(saved).forEach(([date,value])=>{
          if(/^\d{4}-\d{2}-\d{2}$/.test(date)) map.set(date,value===true);
        });
      }
      habitData.set(name,map);
    });
  }
  function updateCard(card){
    const map=habitData.get(card.dataset.name), dates=visibleDates();
    const segments=[...card.querySelectorAll('.segment')];
    segments.forEach((segment,i)=>{
      const done=!!map.get(key(dates[i]));
      segment.classList.toggle('done',done);
      segment.setAttribute('aria-label',''+key(dates[i])+ (done?' complete':' incomplete'));
    });
    const start=shift(selectedDate,-29);
    let completed=0;
    for(let i=0;i<30;i++) if(map.get(key(shift(start,i)))) completed++;
    card.querySelector('.percent').textContent=Math.round(completed/30*100)+'%';
  }
  function renderCalendar(){
    monthEl.textContent=months[selectedDate.getMonth()];
    daysEl.innerHTML='';
    visibleDates().forEach(date=>{
      const btn=document.createElement('button');
      btn.className='day'+(key(date)===key(selectedDate)?' selected':'');
      if(key(date)===key(selectedDate)) btn.setAttribute('aria-current','date');
      btn.innerHTML='<span>'+weekday[date.getDay()]+'</span><span class="num">'+date.getDate()+'</span>';
      btn.addEventListener('click',()=>{
        selectedDate=new Date(date.getFullYear(),date.getMonth(),date.getDate());
        saveState();
        renderCalendar(); document.querySelectorAll('.habit').forEach(updateCard);
      });
      daysEl.appendChild(btn);
    });
  }
  function mark(card,done){
    const map=habitData.get(card.dataset.name);
    map.set(key(selectedDate),!!done);
    saveState();
    updateCard(card);
    card.classList.remove('swiped-left','swiped-right','done-animation','undo-animation');
    void card.offsetWidth;
    card.classList.add(done?'swiped-right':'swiped-left',done?'done-animation':'undo-animation');
    window.setTimeout(()=>card.classList.remove('swiped-left','swiped-right','done-animation','undo-animation'),760);
  }
  document.getElementById('prev').addEventListener('click',()=>{
    selectedDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth()-1,Math.min(selectedDate.getDate(),new Date(selectedDate.getFullYear(),selectedDate.getMonth(),0).getDate()));
    saveState();renderCalendar();document.querySelectorAll('.habit').forEach(updateCard);
  });
  document.getElementById('next').addEventListener('click',()=>{
    selectedDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth()+1,Math.min(selectedDate.getDate(),new Date(selectedDate.getFullYear(),selectedDate.getMonth()+2,0).getDate()));
    saveState();renderCalendar();document.querySelectorAll('.habit').forEach(updateCard);
  });
  const savedHabits=loadState();
  initializeHistory(savedHabits);
  document.querySelectorAll('.habit').forEach(card=>{
    const segments=[...card.querySelectorAll('.segment')];
    let startX=0,startY=0,tracking=false;
    const isCompletedForSelectedDay=()=>habitData.get(card.dataset.name).get(key(selectedDate))===true;
    card.addEventListener('pointerdown',e=>{
      startX=e.clientX;startY=e.clientY;tracking=true;
      card.classList.add('dragging');
      try{card.setPointerCapture(e.pointerId)}catch(_){}
    });
    card.addEventListener('pointermove',e=>{
      if(!tracking)return;
      const dx=e.clientX-startX,dy=e.clientY-startY;
      if(Math.abs(dx)>Math.abs(dy)*0.8){
        const canUndo=isCompletedForSelectedDay();
        const shift=Math.max(canUndo?-72:0,Math.min(72,dx*0.72));
        card.style.transform='translateX('+shift+'px)';
      }
    });
    card.addEventListener('pointerup',e=>{
      if(!tracking)return;tracking=false;
      const dx=e.clientX-startX,dy=e.clientY-startY;
      const canUndo=isCompletedForSelectedDay();
      card.classList.remove('dragging');card.style.transform='';
      if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)*1.05){
        if(dx>0) mark(card,true);
        else if(canUndo) mark(card,false);
      }
    });
    card.addEventListener('pointercancel',()=>{
      tracking=false;card.classList.remove('dragging');card.style.transform='';
    });
    updateCard(card);
  });
  renderCalendar();
  document.querySelectorAll('.habit').forEach(updateCard);
})();
</script>

<div class="auth-backdrop" id="auth-backdrop" role="dialog" aria-modal="true" aria-labelledby="auth-title">
  <div class="auth-panel">
    <h2 id="auth-title">Sync your habits</h2>
    <p>Sign in with your email to keep your habit history in the cloud and use it on all your devices.</p>
    <form id="auth-form"><input id="auth-email" type="email" autocomplete="email" placeholder="Your email address" required><button id="auth-submit" type="submit">Send sign-in link</button></form>
    <div class="auth-message" id="auth-message"></div>
    <button class="auth-close" id="auth-close" type="button">Close</button>
  </div>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.4';
const SUPABASE_URL='https://ifhavtkexjpfgjhmyrxp.supabase.co';
const SUPABASE_KEY='sb_publishable_ZIcZYPUOIh_tX0Y29F_yjA_yq4oja_d';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const STORAGE_KEY='habit-plus-state-v1';
const defaults=[['Reading','reading',0],['Meditation','meditation',1],['Water','water',2],['Push-ups','push-ups',3]];
const $=id=>document.getElementById(id);
let currentUser=null, syncing=false, hydrating=false, habitIds={};
const status=(s)=>$('cloud-status').textContent=s;
function showAuth(){ $('auth-backdrop').classList.add('open'); $('auth-email').focus(); }
function hideAuth(){ $('auth-backdrop').classList.remove('open'); }
$('account-button').addEventListener('click',async()=>{
 if(currentUser){if(confirm('Sign out of Habit Plus on this device?')) await supabase.auth.signOut();}
 else showAuth();
});
$('auth-close').addEventListener('click',hideAuth);
$('auth-backdrop').addEventListener('click',e=>{if(e.target===$('auth-backdrop'))hideAuth();});
$('auth-form').addEventListener('submit',async e=>{
 e.preventDefault();
 const email=$('auth-email').value.trim();
 $('auth-submit').disabled=true;$('auth-message').textContent='Sending secure sign-in link…';
 const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
 $('auth-submit').disabled=false;
 $('auth-message').textContent=error?error.message:'Check your email and open the sign-in link on this device.';
});
async function ensureHabits(){
 const {data,error}=await supabase.from('habits').select('id,habit_key,name,sort_order').order('sort_order');
 if(error)throw error;
 if(!data.length){
  const rows=defaults.map(([name,slug,sort_order])=>({name,habit_key:slug,sort_order}));
  const {error:insertError}=await supabase.from('habits').insert(rows);
  if(insertError)throw insertError;
  return ensureHabits();
 }
 data.forEach(h=>habitIds[h.name]=h.id);
}
function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function fromLocalDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
async function loadCloud(){
 status('Loading cloud data…');
 await ensureHabits();
 const [{data:rows,error:readError},{data:settings,error:settingsError}]=await Promise.all([
  supabase.from('habit_completions').select('habit_id,completed_on,is_completed'),
  supabase.from('user_settings').select('selected_date').maybeSingle()
 ]);
 if(readError)throw readError;if(settingsError)throw settingsError;
 const today=dateKey(new Date());
 const legacy=(()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{return null}})();
 const migrating=rows.length===0 && legacy?.habits && Object.keys(legacy.habits).length>0;
 const selected=settings?.selected_date||(migrating&&legacy.selectedDate?legacy.selectedDate:today);
 const local={};
 defaults.forEach(([name])=>{
  local[name]={};
  const start=fromLocalDate(selected);
  for(let i=29;i>=0;i--){const d=new Date(start);d.setDate(d.getDate()-i);local[name][dateKey(d)]=false;}
 });
 const idToName=Object.fromEntries(Object.entries(habitIds).map(([n,id])=>[id,n]));
 if(migrating){
  const importRows=[];
  for(const [name,dates] of Object.entries(legacy.habits)){
   const habit_id=habitIds[name];if(!habit_id)continue;
   for(const [completed_on,value] of Object.entries(dates||{})){
    if(/^\d{4}-\d{2}-\d{2}$/.test(completed_on)){
     local[name][completed_on]=value===true;
     importRows.push({user_id:currentUser.id,habit_id,completed_on,is_completed:value===true});
    }
   }
  }
  if(importRows.length){
   const {error:importError}=await supabase.from('habit_completions').upsert(importRows,{onConflict:'user_id,habit_id,completed_on'});
   if(importError)throw importError;
  }
 }
 rows.forEach(row=>{const name=idToName[row.habit_id];if(name)local[name][row.completed_on]=row.is_completed;});
 const serialized=JSON.stringify({selectedDate:selected,habits:local});
 if(localStorage.getItem(STORAGE_KEY)!==serialized){
  hydrating=true;localStorage.setItem(STORAGE_KEY,serialized);hydrating=false;
  status(migrating?'Imported browser history':'Synced');
  location.reload();
 }else status('Synced');
}
async function syncLocalState(raw){
 if(!currentUser||syncing||hydrating)return;
 let state;try{state=JSON.parse(raw);}catch{return;}
 syncing=true;status('Saving…');
 try{
  const rows=[];
  for(const [name,dates] of Object.entries(state.habits||{})){
   const habit_id=habitIds[name];if(!habit_id)continue;
   for(const [completed_on,value] of Object.entries(dates||{})){
    if(/^\d{4}-\d{2}-\d{2}$/.test(completed_on))
     rows.push({user_id:currentUser.id,habit_id,completed_on,is_completed:value===true,updated_at:new Date().toISOString()});
   }
  }
  if(rows.length){
   const {error}=await supabase.from('habit_completions').upsert(rows,{onConflict:'user_id,habit_id,completed_on'});
   if(error)throw error;
  }
  const {error:settingsError}=await supabase.from('user_settings').upsert({user_id:currentUser.id,selected_date:state.selectedDate||dateKey(new Date()),updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(settingsError)throw settingsError;
  status('Synced');
 }catch(error){console.error('Cloud sync failed',error);status('Sync error — check connection');}
 finally{syncing=false;}
}
const originalSetItem=Storage.prototype.setItem;
Storage.prototype.setItem=function(key,value){
 originalSetItem.call(this,key,value);
 if(key===STORAGE_KEY)syncLocalState(value);
};
async function onSession(session){
 currentUser=session?.user||null;
 if(currentUser){
  $('account-button').textContent='Sign out';
  try{await loadCloud();}catch(error){console.error(error);status('Cloud error');}
 }else{
  $('account-button').textContent='Sign in';
  status('Not signed in');
 }
}
supabase.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>onSession(session),0);});
supabase.auth.getSession().then(({data,error})=>{
 if(error){status('Connection error');return;}
 onSession(data.session);
});
</script>
</body>
</html>
