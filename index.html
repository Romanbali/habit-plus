<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff8fc">
<meta name="google" content="notranslate">
<title>Habit Plus</title>
<style>
:root{--ink:#17151a;--muted:#77717d;--green:#20b52b;--track:#e8deec;--page:#fff8fc;--col:58px;--gap:8px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{background:linear-gradient(180deg,#fffafd,#fff5fb)}
button{font:inherit}
.app{width:min(100%,880px);min-height:100vh;margin:auto;padding:34px 17px 70px;position:relative}
.account-bar{display:none;justify-content:flex-end;align-items:center;gap:10px;min-height:28px;margin-bottom:18px}
body.authenticated .account-bar{display:flex}
.account-status{font-size:12px;color:var(--muted)}
.account-button{border:1px solid #ded7df;background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;color:#28242b;cursor:pointer}
.month-head{height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px 0}
.month-title{font:700 clamp(30px,5vw,42px)/1 Georgia,serif;letter-spacing:-1.3px;text-align:center;margin:0}
.month-nav{width:48px;height:48px;border:0;border-radius:18px;background:#e9eee8;color:#173d25;display:grid;place-items:center;cursor:pointer}
.month-nav:last-child{justify-self:end}
.month-nav svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.timeline-viewport{margin-top:18px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.timeline-viewport::-webkit-scrollbar{display:none}
.timeline-content{position:relative;width:max-content;min-width:100%;padding-bottom:8px}
.date-row,.progress-row{display:grid;grid-template-columns:repeat(var(--days,30),var(--col));column-gap:var(--gap);width:max-content;position:relative;z-index:5}
.date-row{z-index:3;align-items:stretch;padding-bottom:3px}
.day{width:var(--col);min-height:64px;border:0;border-radius:15px;background:rgba(255,255,255,.78);color:#55515c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:6px 0;user-select:none}
.day .weekday{font-size:10px;font-weight:700;color:#948d98;line-height:1}
.day .num{font-size:20px;font-weight:600;line-height:1}
.day.selected{background:#8cae8a;color:#fff}
.day.selected .weekday{color:rgba(255,255,255,.9)}
.day.today:not(.selected){box-shadow:inset 0 0 0 1.5px #8cae8a;color:#547b56}
.day.future{background:rgba(235,235,235,.45);color:#b8b8b8}
.day.future .weekday,.day.future .num{color:#bcb8c0}
.habit-list{display:flex;flex-direction:column;gap:20px;margin-top:50px}
.habit-card{position:relative;z-index:auto;width:100%;min-width:0;border:1.5px solid var(--edge);background:var(--surface);border-radius:30px;padding:18px 18px 20px;box-shadow:0 7px 18px rgba(85,55,94,.065);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .22s ease,box-shadow .22s ease}
.habit-card.dragging{transition:none;box-shadow:0 12px 25px rgba(70,90,70,.16)}
.habit-card.swiped-right{transform:translateX(12px);border-color:#a8d6a5}
.habit-card.swiped-left{transform:translateX(-12px);border-color:#d8cbdc}
.habit-top{height:68px;display:grid;grid-template-columns:68px minmax(130px,1fr) auto;align-items:center;gap:18px;position:relative;z-index:5}
.icon-tile{width:68px;height:62px;border-radius:20px;background:var(--icon-bg);display:grid;place-items:center}
.icon-tile svg{width:43px;height:43px;stroke:var(--icon-color);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.habit-name{font-size:clamp(21px,4vw,31px);line-height:1;font-weight:700;letter-spacing:-.7px;white-space:nowrap}
.percent{font-size:clamp(21px,4vw,30px);font-weight:600;color:#56535f;letter-spacing:-.8px}
.progress-row{z-index:3;margin-top:12px;align-items:center}
.segment{width:var(--col);height:22px;border:0;border-radius:15px;background:var(--track);padding:0;cursor:pointer;position:relative;z-index:3}
.segment.done{background:var(--green);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.guides{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.guides span{position:absolute;top:67px;bottom:0;width:0;border-left:1px dashed rgba(155,133,165,.42)}
.reading{--surface:rgba(245,231,250,.82);--edge:#f0e2f4;--icon-bg:rgba(226,208,238,.72);--icon-color:#55505d}
.meditation{--surface:rgba(255,235,240,.84);--edge:#f8e1e8;--icon-bg:rgba(255,215,224,.72);--icon-color:#8d170f}
.water{--surface:rgba(232,237,255,.86);--edge:#dfe5ff;--icon-bg:rgba(207,218,255,.72);--icon-color:#082b4c}
.pushups{--surface:rgba(244,249,242,.9);--edge:#e1eee0;--icon-bg:rgba(222,235,216,.78);--icon-color:#0c351b}
.habit-card::after{position:absolute;right:18px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 20px Arial,sans-serif;opacity:0;pointer-events:none;z-index:5}
.habit-card.done-animation::after{content:"✓";background:#20b52b;color:#fff;animation:pop .55s ease both}
.habit-card.undo-animation::after{content:"↶";background:#887294;color:#fff;animation:pop .55s ease both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@media(max-width:650px){
 :root{--col:52px;--gap:6px}
 .app{padding:22px 12px 50px}
 .account-bar{margin-bottom:12px}
 .month-head{height:54px;padding:0 3px}
 .month-nav{width:42px;height:42px;border-radius:15px}
 .month-title{font-size:clamp(27px,7vw,35px)}
 .timeline-viewport{margin-top:14px}
 .day{min-height:56px;border-radius:12px}
 .day .weekday{font-size:9px}
 .day .num{font-size:18px}
 .habit-list{margin-top:36px;gap:15px}
 .habit-card{border-radius:24px;padding:13px 12px 16px}
 .habit-top{height:58px;grid-template-columns:54px minmax(115px,1fr) auto;gap:10px}
 .icon-tile{width:54px;height:52px;border-radius:17px}
 .icon-tile svg{width:36px;height:36px}
 .habit-name{font-size:clamp(18px,4.5vw,25px)}
 .percent{font-size:clamp(18px,4.5vw,25px)}
 .progress-row{margin-top:10px}
 .segment{height:17px;border-radius:12px}
 .guides span{top:58px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
.tracker-content{display:none}
body.authenticated .tracker-content{display:block}
.welcome-screen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#fff8fc,#f5edf7)}
body.authenticated .welcome-screen{display:none}
.welcome-card{width:min(100%,390px);text-align:center;background:rgba(255,255,255,.9);border:1px solid #eee4ef;border-radius:28px;padding:36px 26px 28px;box-shadow:0 18px 50px rgba(85,55,94,.09)}
.welcome-mark{width:64px;height:64px;border-radius:20px;background:#e9eee8;color:#173d25;display:grid;place-items:center;font:700 36px Georgia,serif;margin:0 auto 20px}
.welcome-card h1{font:700 36px Georgia,serif;margin:0 0 10px}
.welcome-card p{font-size:14px;line-height:1.5;color:#716b75;margin:0 0 22px}
.auth-google{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;height:50px;border:1px solid #ded9df;background:#fff;color:#262329;border-radius:13px;font-weight:700;font-size:15px;cursor:pointer}
.auth-google:disabled{opacity:.6}
.google-g{font-weight:800;font-size:19px;color:#4285f4}
.welcome-foot{font-size:12px;line-height:1.45;color:#96909a;margin-top:22px}
.welcome-message{font-size:13px;color:#62566a;min-height:18px;margin-bottom:8px}
</style>
</head>

<main class="app">
 <div class="account-bar"><span class="account-status" id="cloud-status">Connecting…</span><button class="account-button" id="account-button">Sign out</button></div>
 <div class="tracker-content">
  <header class="month-head">
   <button class="month-nav" id="prev" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>

   <div class="welcome-foot">Your progress stays private and syncs across your devices.</div>

 </section>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id);
 const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
 const weekdays=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 const STORAGE_KEY='habit-plus-state-v1';
 const names=['Reading','Meditation','Water','Push-ups'];
 const icons={
  'Reading':'<svg viewBox="0 0 64 64"><path d="M32 17c-7-9-22-8-27-2v37c8-5 19-4 27 3 8-7 19-8 27-3V15c-6-6-20-7-27 2Z"/><path d="M32 17v38"/></svg>',
  'Meditation':'<svg viewBox="0 0 64 64"><path d="M32 10c-8 8-12 16-12 24 0 8 5 13 12 16 7-3 12-8 12-16 0-8-4-16-12-24Z"/><path d="M20 29C10 26 5 29 4 33c5 8 11 12 20 12M44 29c10-3 15 0 16 4-5 8-11 12-20 12"/><path d="M20 45c-1 5 2 8 6 10M44 45c1 5-2 8-6 10M26 53h12"/></svg>',
  'Water':'<svg viewBox="0 0 64 64"><path d="M32 7C24 20 14 31 14 42a18 18 0 0 0 36 0C50 31 40 20 32 7Z"/></svg>',
  'Push-ups':'<svg viewBox="0 0 64 64"><circle cx="47" cy="14" r="5" fill="currentColor" stroke="none"/><path d="m42 19-11 7-8 7-17 8 3 7 20-7 12-7 7-2 7 5 4-6-9-9Z" fill="currentColor" stroke="none"/><path d="m17 43-6 11M43 39l8 10"/></svg>'
 };
 let selectedDate=dayStart(new Date());
 let viewedMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
 let monthAnchorDay=selectedDate.getDate();
 const data=new Map();
 const demo={
  'Reading':{total:21,tail:[1,1,0,1,1,0,1,1,0,1]},
  'Meditation':{total:18,tail:[1,0,1,1,1,0,0,1,0,0]},
  'Water':{total:27,tail:[1,1,0,1,1,1,1,1,1,1]},
  'Push-ups':{total:23,tail:[1,1,0,1,1,0,1,1,0,0]}
 };
 function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
 function shift(d,n){const x=dayStart(d);x.setDate(x.getDate()+n);return x;}
 function key(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
 function loadState(){
  let saved={};try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')||{};}catch(e){console.warn(e);}
  const today=dayStart(new Date());selectedDate=today;viewedMonth=new Date(today.getFullYear(),today.getMonth(),1);monthAnchorDay=today.getDate();
  names.forEach(name=>{
   const map=new Map(),spec=demo[name],tailStart=shift(today,-9),older=spec.total-spec.tail.reduce((a,b)=>a+b,0);
   for(let i=0;i<20;i++)map.set(key(shift(today,-29+i)),i<older);
   spec.tail.forEach((v,i)=>map.set(key(shift(tailStart,i)),!!v));
   Object.entries(saved.habits?.[name]||{}).forEach(([date,value])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(date))map.set(date,value===true);});
   data.set(name,map);
  });
 }
 function saveState(){
  const habits={};names.forEach(name=>habits[name]=Object.fromEntries(data.get(name)));
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({selectedDate:key(selectedDate),habits}));}catch(e){console.warn(e);}
 }
 function monthDates(){return new Date(viewedMonth.getFullYear(),viewedMonth.getMonth()+1,0).getDate();}
 function updateGuides(){
  const guides=$('guides'),n=monthDates(),style=getComputedStyle($('timeline-content'));
  const column=parseFloat(style.getPropertyValue('--col'))||58,gap=parseFloat(style.getPropertyValue('--gap'))||8;
  guides.innerHTML='';
  for(let i=0;i<n;i++){const line=document.createElement('span');line.style.left=(i*(column+gap)+column/2)+'px';guides.appendChild(line);}
 }
 function updatePercent(card){
  const map=data.get(card.dataset.name),start=shift(dayStart(new Date()),-29);let count=0;
  for(let i=0;i<30;i++)if(map.get(key(shift(start,i))))count++;
  card.querySelector('.percent').textContent=Math.round(count/30*100)+'%';
 }
 function renderCards(){
  const list=$('habit-list');list.innerHTML='';
  names.forEach(name=>{
   const card=document.createElement('article');card.className='habit-card '+({'Reading':'reading','Meditation':'meditation','Water':'water','Push-ups':'pushups'}[name]);card.dataset.name=name;
   card.innerHTML='<div class="habit-top"><div class="icon-tile">'+icons[name]+'</div><div class="habit-name">'+name+'</div><div class="percent">0%</div></div><div class="progress-row" aria-label="'+name+' progress"></div>';
   const row=card.querySelector('.progress-row'),map=data.get(name);
   for(let day=1;day<=monthDates();day++){
    const date=new Date(viewedMonth.getFullYear(),viewedMonth.getMonth(),day),done=map.get(key(date))===true;
    const segment=document.createElement('button');segment.type='button';segment.className='segment'+(done?' done':'');
    segment.setAttribute('aria-label',key(date)+(done?' complete':' incomplete'));segment.title=date.toLocaleDateString('en',{month:'long',day:'numeric'})+(done?' — complete':' — incomplete');
    row.appendChild(segment);
   }
   updatePercent(card);bindSwipe(card);list.appendChild(card);
  });
 }
 function renderDates(){
  const dates=$('dates');dates.innerHTML='';const todayKey=key(new Date());
  dates.style.setProperty('--days',monthDates());
  for(let day=1;day<=monthDates();day++){
   const date=new Date(viewedMonth.getFullYear(),viewedMonth.getMonth(),day),dateKey=key(date),isToday=dateKey===todayKey,isFuture=dateKey>todayKey;
   const button=document.createElement('button');button.type='button';button.className='day'+(dateKey===key(selectedDate)?' selected':'')+(isToday?' today':'')+(isFuture?' future':'');button.dataset.date=dateKey;
   button.setAttribute('aria-label',date.toLocaleDateString('en',{weekday:'long',year:'numeric',month:'long',day:'numeric'}));
   button.innerHTML='<span class="weekday">'+weekdays[date.getDay()]+'</span><span class="num">'+day+'</span>';
   button.addEventListener('click',()=>{selectedDate=dayStart(date);monthAnchorDay=day;saveState();dates.querySelectorAll('.day').forEach(el=>{const active=el.dataset.date===dateKey;el.classList.toggle('selected',active);if(active)el.setAttribute('aria-current','date');else el.removeAttribute('aria-current');});});
   if(dateKey===key(selectedDate))button.setAttribute('aria-current','date');
   dates.appendChild(button);
  }
  $('month').textContent=monthNames[viewedMonth.getMonth()]+' '+viewedMonth.getFullYear();
  updateGuides();
 }
 function render(){
  $('timeline-content').style.setProperty('--days',monthDates());
  renderDates();renderCards();updateGuides();
 }
 function alignToday(){
  if(key(viewedMonth)!==key(new Date()).slice(0,7)+'-01')return;
  const button=$('dates').querySelector('[data-date="'+key(new Date())+'"]'),viewport=$('timeline-viewport');
  if(!button||!viewport)return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
   const br=button.getBoundingClientRect(),vr=viewport.getBoundingClientRect();
   viewport.scrollLeft+=br.right-vr.right;
  }));
 }
 function changeMonth(delta){
  const next=new Date(viewedMonth.getFullYear(),viewedMonth.getMonth()+delta,1),last=new Date(next.getFullYear(),next.getMonth()+1,0).getDate();
  viewedMonth=next;selectedDate=new Date(next.getFullYear(),next.getMonth(),Math.min(monthAnchorDay,last));saveState();render();
  $('timeline-viewport').scrollLeft=0;
 }
 $('prev').addEventListener('click',()=>changeMonth(-1));$('next').addEventListener('click',()=>changeMonth(1));
 function mark(card,done){
  const map=data.get(card.dataset.name);map.set(key(selectedDate),!!done);saveState();
  const row=card.querySelector('.progress-row');[...row.children].forEach((el,i)=>{const d=new Date(viewedMonth.getFullYear(),viewedMonth.getMonth(),i+1);el.classList.toggle('done',map.get(key(d))===true);});
  updatePercent(card);card.classList.remove('done-animation','undo-animation','swiped-left','swiped-right');void card.offsetWidth;card.classList.add(done?'done-animation':'undo-animation',done?'swiped-right':'swiped-left');
  setTimeout(()=>card.classList.remove('done-animation','undo-animation','swiped-left','swiped-right'),700);
 }
 function bindSwipe(card){
  let sx=0,sy=0,tracking=false,moved=false;
  const completed=()=>data.get(card.dataset.name).get(key(selectedDate))===true;
  const start=(x,y)=>{sx=x;sy=y;tracking=true;moved=false;card.classList.add('dragging');};
  const move=(x,y,e)=>{if(!tracking)return;const dx=x-sx,dy=y-sy;if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.05){moved=true;if(e?.cancelable)e.preventDefault();const shiftX=Math.max(completed()?-64:0,Math.min(64,dx*.7));card.style.transform='translateX('+shiftX+'px)';}};
  const end=(x,y)=>{if(!tracking)return;tracking=false;const dx=x-sx,dy=y-sy;card.classList.remove('dragging');card.style.transform='';if(moved&&Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)*1.05){if(dx>0)mark(card,true);else if(completed())mark(card,false);}};
  const cancel=()=>{tracking=false;moved=false;card.classList.remove('dragging');card.style.transform='';};
  card.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')start(e.clientX,e.clientY);});
  card.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')move(e.clientX,e.clientY,e);});
  card.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')end(e.clientX,e.clientY);});
  card.addEventListener('pointercancel',cancel);
  card.addEventListener('touchstart',e=>{if(e.touches.length===1)start(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  card.addEventListener('touchmove',e=>{if(tracking&&e.touches.length===1)move(e.touches[0].clientX,e.touches[0].clientY,e);},{passive:false});
  card.addEventListener('touchend',e=>{const t=e.changedTouches[0];if(t)end(t.clientX,t.clientY);},{passive:true});
  card.addEventListener('touchcancel',cancel);
 }
 loadState();render();
 window.alignHabitCalendarToToday=alignToday;
 window.addEventListener('pageshow',e=>{if(e.persisted)alignToday();});
})();
</script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.4';
const SUPABASE_URL='https://ifhavtkexjpfgjhmyrxp.supabase.co';
const SUPABASE_KEY='sb_publishable_ZIcZYPUOIh_tX0Y29F_yjA_yq4oja_d';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:window.localStorage,storageKey:'habit-plus-google-session',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const STORAGE_KEY='habit-plus-state-v1';
const defaults=[['Reading','reading',0],['Meditation','meditation',1],['Water','water',2],['Push-ups','push-ups',3]];
const $=id=>document.getElementById(id);
let currentUser=null, syncing=false, hydrating=false, habitIds={};
const status=(s)=>$('cloud-status').textContent=s;
let authBusy=false;
async function startGoogleSignIn(){
 if(authBusy)return;
 authBusy=true;$('welcome-google').disabled=true;$('welcome-message').textContent='Connecting to Google…';
 try{
  const {error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://romanbali.github.io/habit-plus/'}});
  if(error)throw error;
 }catch(error){
  $('welcome-message').textContent=error.message||'Google sign-in is unavailable. Please try again.';
  authBusy=false;$('welcome-google').disabled=false;
 }
}
$('welcome-google').addEventListener('click',startGoogleSignIn);
$('account-button').addEventListener('click',async()=>{
 if(currentUser){if(confirm('Sign out of Habit Plus on this device?')) await supabase.auth.signOut();}
 else startGoogleSignIn();
});
async function ensureHabits(){
 const {data,error}=await supabase.from('habits').select('id,habit_key,name,sort_order').order('sort_order');
 if(error)throw error;
 if(!data.length){
  const rows=defaults.map(([name,slug,sort_order])=>({user_id:currentUser.id,name,habit_key:slug,sort_order}));
  const {error:insertError}=await supabase.from('habits').insert(rows);
  if(insertError)throw insertError;
  return ensureHabits();
 }
 data.forEach(h=>habitIds[h.name]=h.id);
}
function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function fromLocalDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
async function loadCloud(){
 status('Loading cloud data…');
 await ensureHabits();
 const [{data:rows,error:readError},{data:settings,error:settingsError}]=await Promise.all([
  supabase.from('habit_completions').select('habit_id,completed_on,is_completed'),
  supabase.from('user_settings').select('selected_date').maybeSingle()
 ]);
 if(readError)throw readError;if(settingsError)throw settingsError;
 const today=dateKey(new Date());
 const legacy=(()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{return null}})();
 const migrating=rows.length===0 && legacy?.habits && Object.keys(legacy.habits).length>0;
 const selected=today;
 const local={};
 defaults.forEach(([name])=>{
  local[name]={};
  const start=fromLocalDate(selected);
  for(let i=29;i>=0;i--){const d=new Date(start);d.setDate(d.getDate()-i);local[name][dateKey(d)]=false;}
 });
 const idToName=Object.fromEntries(Object.entries(habitIds).map(([n,id])=>[id,n]));
 if(migrating){
  const importRows=[];
  for(const [name,dates] of Object.entries(legacy.habits)){
   const habit_id=habitIds[name];if(!habit_id)continue;
   for(const [completed_on,value] of Object.entries(dates||{})){
    if(/^\d{4}-\d{2}-\d{2}$/.test(completed_on)){
     local[name][completed_on]=value===true;
     importRows.push({user_id:currentUser.id,habit_id,completed_on,is_completed:value===true});
    }
   }
  }
  if(importRows.length){
   const {error:importError}=await supabase.from('habit_completions').upsert(importRows,{onConflict:'user_id,habit_id,completed_on'});
   if(importError)throw importError;
  }
 }
 rows.forEach(row=>{const name=idToName[row.habit_id];if(name)local[name][row.completed_on]=row.is_completed;});
 const serialized=JSON.stringify({selectedDate:selected,habits:local});
 if(localStorage.getItem(STORAGE_KEY)!==serialized){
  hydrating=true;localStorage.setItem(STORAGE_KEY,serialized);hydrating=false;
  status(migrating?'Imported browser history':'Synced');
  location.reload();
 }else status('Synced');
}
async function syncLocalState(raw){
 if(!currentUser||syncing||hydrating)return;
 let state;try{state=JSON.parse(raw);}catch{return;}
 syncing=true;status('Saving…');
 try{
  const rows=[];
  for(const [name,dates] of Object.entries(state.habits||{})){
   const habit_id=habitIds[name];if(!habit_id)continue;
   for(const [completed_on,value] of Object.entries(dates||{})){
    if(/^\d{4}-\d{2}-\d{2}$/.test(completed_on))
     rows.push({user_id:currentUser.id,habit_id,completed_on,is_completed:value===true,updated_at:new Date().toISOString()});
   }
  }
  if(rows.length){
   const {error}=await supabase.from('habit_completions').upsert(rows,{onConflict:'user_id,habit_id,completed_on'});
   if(error)throw error;
  }
  const {error:settingsError}=await supabase.from('user_settings').upsert({user_id:currentUser.id,selected_date:state.selectedDate||dateKey(new Date()),updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(settingsError)throw settingsError;
  status('Synced');
 }catch(error){console.error('Cloud sync failed',error);status('Sync error — check connection');}
 finally{syncing=false;}
}
const originalSetItem=Storage.prototype.setItem;
Storage.prototype.setItem=function(key,value){
 originalSetItem.call(this,key,value);
 if(key===STORAGE_KEY)syncLocalState(value);
};
async function onSession(session){
 currentUser=session?.user||null;
 document.body.classList.toggle('authenticated',!!currentUser);
 if(currentUser){
  $('account-button').textContent='Sign out';
  try{await loadCloud();}catch(error){console.error(error);status('Cloud error');}
  // Wait until authenticated content is visible before measuring the calendar.
  requestAnimationFrame(()=>requestAnimationFrame(()=>window.alignHabitCalendarToToday?.()));
 }else{
  $('account-button').textContent='Sign in';
  status('Not signed in');
 }
}
supabase.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>onSession(session),0);});
supabase.auth.getSession().then(({data,error})=>{
 if(error){status('Connection error');return;}
 onSession(data.session);
});
</script>
